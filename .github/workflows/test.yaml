name: Test

"on":
  pull_request:

permissions:
  contents: read

jobs:
  entrypoint:
    name: Entrypoint regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract Node.js version from Dockerfile
        id: node-version
        run: |
          NODE_VERSION=$(grep '^FROM node:' Dockerfile | sed 's/.*node:\([0-9.]*\).*/\1/')
          echo "version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Node entrypoint syntax
        run: node --check fallback-runner.mjs
      - name: Prepare local release configuration
        run: cp fallback-config.cjs .releaserc.cjs
      - name: Test entrypoint
        run: npm test
